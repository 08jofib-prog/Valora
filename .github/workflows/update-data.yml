name: Uppdatera kursdata

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Hämta kurser
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python3 fetch_data.py --out data.json

      - name: Committa om datan ändrats
        run: |
          git config user.name "valora-bot"
          git config user.email "valora-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Ingen ändring."
          else
            git commit -m "Uppdatera kursdata $(date -u +%F)"
            git push
          fi
